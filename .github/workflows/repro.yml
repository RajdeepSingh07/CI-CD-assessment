name: Replicate Cloudsmith Manifest Failure
on: workflow_dispatch # This lets you run it manually from the UI

jobs:
  repro-job:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Cloudsmith
        uses: docker/login-action@v3
        with:
          registry: docker.cloudsmith.io
          username: "rajdeep-singh"
          password: "csa_9633b802283ea4ae6169027db8d319IRNlTQ"

      - name: Push and Manifest
        run: |
          export REPO=docker.cloudsmith.io/workspace-for-rajdeep/docker-test
          export TAG=ui-repro-${{ github.run_id }}
          export IMAGE=$REPO/backstage:$TAG

          # 1. Push
          docker pull --platform linux/amd64 alpine:latest
          docker tag alpine:latest $IMAGE-amd64
          docker push $IMAGE-amd64

          docker pull --platform linux/arm64 alpine:latest
          docker tag alpine:latest $IMAGE-arm64
          docker push $IMAGE-arm64

          # 2. Manifest (The failing part)
          docker manifest create $IMAGE --amend $IMAGE-amd64 --amend $IMAGE-arm64
