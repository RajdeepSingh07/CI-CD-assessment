name: Replicate Cloudsmith Manifest Failure
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  manifest-only:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Cloudsmith via OIDC
        id: cloudsmith-login
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          oidc-namespace: 'workspace-for-rajdeep'
          oidc-service-slug: 'bot-wSY1'
          oidc-audience: 'https://token.actions.githubusercontent.com'
          oidc-auth-only: true

      - name: Login to Cloudsmith Docker registry
        uses: docker/login-action@v3
        with:
          registry: docker.cloudsmith.io
          username: 'bot-wSY1'
          password: ${{ steps.cloudsmith-login.outputs.oidc-token }}

      - name: Create Multi-Arch Manifest
        run: |
          # Use the EXACT same TAG you used in Step 1
          export REPO=docker.cloudsmith.io/workspace-for-rajdeep/docker-test
          export TAG=manual-pre-push
          export IMAGE=$REPO/backstage:$TAG
          
          docker manifest create $IMAGE --amend $IMAGE-amd64 --amend $IMAGE-arm64
